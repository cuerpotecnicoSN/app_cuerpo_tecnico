name: Scrape Flashscore Matches

on:
  schedule:
    # Ejecutar cada 2 días a las 00:00 UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Permitir ejecución manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase
          playwright install chromium
          
      - name: Ejecutar script de scraping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TUTTOCAMPO_EMAIL: ${{ secrets.TUTTOCAMPO_EMAIL }}
          TUTTOCAMPO_PASSWORD: ${{ secrets.TUTTOCAMPO_PASSWORD }}
        run: |
          python scripts/scrape_matches.py
          python scripts/scrape_league.py
